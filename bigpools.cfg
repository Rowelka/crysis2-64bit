-- Limits raised past what a 2011 console build assumed, for a machine that has the memory.
--
-- These are the numbers that make 64-bit worth having. The defaults were sized for an Xbox 360
-- with 512 MB shared between the game and the GPU, and they came across to the PC build
-- unchanged: a 24 MB pool for streamed meshes, a texture pool the engine computes from a VRAM
-- reading that returns zero on modern drivers.
--
-- Not applied automatically. Run with:  launcher64.exe +exec bigpools.cfg
-- and watch launcher_faults.txt for the memory census line.

-- Textures. The engine's own detection reads 0 MB of VRAM from this driver, so this has to be
-- set by hand either way; autoexec already forces 1024.
r_TexturesStreamPoolSize = 3072

-- Meshes streamed from disk. Only matters with e_StreamCgf = 1; autoexec currently turns
-- streaming off entirely, which loads every mesh whole and uses more memory, not less.
e_StreamCgfPoolSize = 256

-- Particles. The default emitter pool is small enough that heavy fights recycle emitters.
e_ParticlesPoolSize = 64
e_ParticlesEmitterPoolSize = 16

-- Render target and mesh pools inside the renderer.
r_MeshPoolSize = 256
r_MeshVolatilePoolSize = 64
